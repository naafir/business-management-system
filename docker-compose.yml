version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-business_billing_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_strong_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # Bind to localhost only in prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-business_billing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billing_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billing_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-business_billing_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change_this_strong_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
      STORAGE_LOCAL_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    expose:
      - "8080"   # Internal only — Nginx handles public access
    volumes:
      - backend_uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - billing_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: billing_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"    # Internal only — Nginx proxies to this
    networks:
      - billing_net

  nginx:
    image: nginx:1.27-alpine
    container_name: billing_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment when you have SSL certs:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - billing_net

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  billing_net:
    driver: bridge
